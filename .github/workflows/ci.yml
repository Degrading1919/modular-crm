name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# dotenv-cli preserves inherited variables and tolerates a missing .env.
# No real provider accounts, deployment credentials, or local .env are needed.
env:
  DATABASE_URL: postgresql://modular:modular@127.0.0.1:5432/modular_crm
  BETTER_AUTH_URL: http://localhost:3000
  APP_BASE_URL: http://localhost:3000
  MOCK_CONNECTORS: "true"
  DOMAIN_VERIFICATION_MODE: mock
  MAILPIT_SMTP_HOST: 127.0.0.1
  MAILPIT_SMTP_PORT: "1025"
  MAILPIT_API_URL: http://127.0.0.1:8025
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm lint
          - name: Typecheck
            command: pnpm typecheck
          - name: Unit and integration tests
            command: pnpm test
          - name: Production build
            command: pnpm build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  e2e:
    name: Playwright (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modular
          POSTGRES_PASSWORD: modular
          POSTGRES_DB: modular_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modular -d modular_crm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports:
          - 1025:1025
          - 8025:8025
    env:
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Chromium and system dependencies
        run: pnpm --filter @modular-crm/web exec playwright install --with-deps chromium
      - name: Migrate PostgreSQL
        run: pnpm db:migrate
      - name: Seed isolated test data
        run: pnpm db:seed
      - name: Run complete Playwright suite
        id: playwright
        run: pnpm test:e2e --reporter=line,html
      - name: Upload browser failure diagnostics
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn
