services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: modular
      POSTGRES_PASSWORD: modular
      POSTGRES_DB: modular_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modular -d modular_crm"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: modular
      MINIO_ROOT_PASSWORD: modular-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres_data:
  minio_data:
